<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Longview — Logo Explorations</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #fafafa;
      color: #0a0a0a;
      -webkit-font-smoothing: antialiased;
    }

    .page-title {
      text-align: center;
      padding: 4rem 2rem 1rem;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #a3a3a3;
    }

    .section-label {
      text-align: center;
      padding: 3rem 2rem 0;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #a3a3a3;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      max-width: 1100px;
      margin: 2rem auto 4rem;
      padding: 0 2rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      border: 1px solid #f0f0f0;
      transition: box-shadow 0.3s;
    }

    .card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.06); }

    .card-label {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #a3a3a3;
    }

    .logo-small {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .logo-tiny svg { width: 20px; }
    .logo-med svg { width: 32px; }

    .dark {
      background: #0a0a0a;
      color: #fafafa;
      border-color: #1a1a1a;
    }

    .dark .card-label { color: #525252; }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="page-title">Longview — Centered Arc Explorations</div>

  <div class="section-label">Light</div>
  <div class="grid">

    <!-- A: Very short, hairline -->
    <div class="card">
      <div class="card-label">A — Hairline</div>
      <svg width="160" height="46" viewBox="0 0 160 46">
        <path d="M 62 10 Q 80 5 98 10" fill="none" stroke="#0a0a0a" stroke-width="0.8" stroke-linecap="round"/>
        <text x="80" y="34" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#0a0a0a">longview</text>
      </svg>
      <div class="logo-small">
        <div class="logo-tiny">
          <svg viewBox="0 0 20 20">
            <path d="M 6 10 Q 10 6 14 10" fill="none" stroke="#0a0a0a" stroke-width="0.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="logo-med">
          <svg viewBox="0 0 32 32">
            <path d="M 10 17 Q 16 12 22 17" fill="none" stroke="#0a0a0a" stroke-width="0.8" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- B: Short, slightly more arc -->
    <div class="card">
      <div class="card-label">B — Breath</div>
      <svg width="160" height="46" viewBox="0 0 160 46">
        <path d="M 60 11 Q 80 3 100 11" fill="none" stroke="#0a0a0a" stroke-width="0.8" stroke-linecap="round"/>
        <text x="80" y="34" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#0a0a0a">longview</text>
      </svg>
      <div class="logo-small">
        <div class="logo-tiny">
          <svg viewBox="0 0 20 20">
            <path d="M 6 11 Q 10 5 14 11" fill="none" stroke="#0a0a0a" stroke-width="0.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="logo-med">
          <svg viewBox="0 0 32 32">
            <path d="M 9 17 Q 16 10 23 17" fill="none" stroke="#0a0a0a" stroke-width="0.8" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- C: Tiny, almost flat -->
    <div class="card">
      <div class="card-label">C — Trace</div>
      <svg width="160" height="44" viewBox="0 0 160 44">
        <path d="M 65 10 Q 80 6 95 10" fill="none" stroke="#0a0a0a" stroke-width="0.7" stroke-linecap="round"/>
        <text x="80" y="33" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#0a0a0a">longview</text>
      </svg>
      <div class="logo-small">
        <div class="logo-tiny">
          <svg viewBox="0 0 20 20">
            <path d="M 7 10 Q 10 7 13 10" fill="none" stroke="#0a0a0a" stroke-width="0.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="logo-med">
          <svg viewBox="0 0 32 32">
            <path d="M 11 16 Q 16 12 21 16" fill="none" stroke="#0a0a0a" stroke-width="0.7" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- D: Medium width, hairline weight -->
    <div class="card">
      <div class="card-label">D — Float</div>
      <svg width="160" height="46" viewBox="0 0 160 46">
        <path d="M 58 12 Q 80 4 102 12" fill="none" stroke="#0a0a0a" stroke-width="0.7" stroke-linecap="round"/>
        <text x="80" y="35" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#0a0a0a">longview</text>
      </svg>
      <div class="logo-small">
        <div class="logo-tiny">
          <svg viewBox="0 0 20 20">
            <path d="M 5 11 Q 10 5 15 11" fill="none" stroke="#0a0a0a" stroke-width="0.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="logo-med">
          <svg viewBox="0 0 32 32">
            <path d="M 8 17 Q 16 10 24 17" fill="none" stroke="#0a0a0a" stroke-width="0.7" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- E: Sits higher, more space -->
    <div class="card">
      <div class="card-label">E — Lift</div>
      <svg width="160" height="50" viewBox="0 0 160 50">
        <path d="M 62 8 Q 80 2 98 8" fill="none" stroke="#0a0a0a" stroke-width="0.8" stroke-linecap="round"/>
        <text x="80" y="38" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#0a0a0a">longview</text>
      </svg>
      <div class="logo-small">
        <div class="logo-tiny">
          <svg viewBox="0 0 20 20">
            <path d="M 6 9 Q 10 5 14 9" fill="none" stroke="#0a0a0a" stroke-width="0.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="logo-med">
          <svg viewBox="0 0 32 32">
            <path d="M 10 14 Q 16 9 22 14" fill="none" stroke="#0a0a0a" stroke-width="0.8" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- F: 1px weight, centered tight -->
    <div class="card">
      <div class="card-label">F — Thread</div>
      <svg width="160" height="46" viewBox="0 0 160 46">
        <path d="M 63 10 Q 80 4 97 10" fill="none" stroke="#0a0a0a" stroke-width="1" stroke-linecap="round"/>
        <text x="80" y="34" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#0a0a0a">longview</text>
      </svg>
      <div class="logo-small">
        <div class="logo-tiny">
          <svg viewBox="0 0 20 20">
            <path d="M 6 10 Q 10 5 14 10" fill="none" stroke="#0a0a0a" stroke-width="1" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="logo-med">
          <svg viewBox="0 0 32 32">
            <path d="M 10 17 Q 16 11 22 17" fill="none" stroke="#0a0a0a" stroke-width="1" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>

  </div>

  <!-- DARK -->
  <div class="section-label">On dark</div>
  <div class="grid">
    <div class="card dark">
      <div class="card-label">A — Hairline</div>
      <svg width="160" height="46" viewBox="0 0 160 46">
        <path d="M 62 10 Q 80 5 98 10" fill="none" stroke="#fafafa" stroke-width="0.8" stroke-linecap="round"/>
        <text x="80" y="34" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#fafafa">longview</text>
      </svg>
    </div>
    <div class="card dark">
      <div class="card-label">B — Breath</div>
      <svg width="160" height="46" viewBox="0 0 160 46">
        <path d="M 60 11 Q 80 3 100 11" fill="none" stroke="#fafafa" stroke-width="0.8" stroke-linecap="round"/>
        <text x="80" y="34" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#fafafa">longview</text>
      </svg>
    </div>
    <div class="card dark">
      <div class="card-label">C — Trace</div>
      <svg width="160" height="44" viewBox="0 0 160 44">
        <path d="M 65 10 Q 80 6 95 10" fill="none" stroke="#fafafa" stroke-width="0.7" stroke-linecap="round"/>
        <text x="80" y="33" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#fafafa">longview</text>
      </svg>
    </div>
    <div class="card dark">
      <div class="card-label">D — Float</div>
      <svg width="160" height="46" viewBox="0 0 160 46">
        <path d="M 58 12 Q 80 4 102 12" fill="none" stroke="#fafafa" stroke-width="0.7" stroke-linecap="round"/>
        <text x="80" y="35" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#fafafa">longview</text>
      </svg>
    </div>
    <div class="card dark">
      <div class="card-label">E — Lift</div>
      <svg width="160" height="50" viewBox="0 0 160 50">
        <path d="M 62 8 Q 80 2 98 8" fill="none" stroke="#fafafa" stroke-width="0.8" stroke-linecap="round"/>
        <text x="80" y="38" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#fafafa">longview</text>
      </svg>
    </div>
    <div class="card dark">
      <div class="card-label">F — Thread</div>
      <svg width="160" height="46" viewBox="0 0 160 46">
        <path d="M 63 10 Q 80 4 97 10" fill="none" stroke="#fafafa" stroke-width="1" stroke-linecap="round"/>
        <text x="80" y="34" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#fafafa">longview</text>
      </svg>
    </div>
  </div>

</body>
</html>
