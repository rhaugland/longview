<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Longview — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0a;
      --white: #fafafa;
      --gray-50: #f9f9f9;
      --gray-100: #f5f5f5;
      --gray-200: #e5e5e5;
      --gray-400: #a3a3a3;
      --gray-500: #737373;
      --gray-600: #525252;
      --warm: #b8a089;
      --green: #16a34a;
      --green-bg: #f0fdf4;
      --blue: #2563eb;
      --blue-bg: #eff6ff;
      --yellow: #ca8a04;
      --yellow-bg: #fefce8;
      --red: #dc2626;
      --red-bg: #fef2f2;
      --purple: #9333ea;
      --purple-bg: #faf5ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      font-weight: 300;
      background: var(--gray-50);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Login */
    .login-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-screen h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .login-screen p {
      color: var(--gray-500);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .login-form {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      max-width: 400px;
    }

    .login-form input {
      flex: 1;
      padding: 0.75rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      outline: none;
      background: var(--white);
    }

    .login-form input:focus { border-color: var(--black); }

    .login-form button {
      padding: 0.75rem 1.5rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      background: var(--black);
      color: var(--white);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-form button:hover { background: #262626; }

    .login-error {
      color: var(--red);
      font-size: 0.82rem;
      margin-top: 1rem;
      display: none;
    }

    /* Dashboard */
    .dashboard { display: none; }

    .dash-nav {
      padding: 1.2rem 2rem;
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dash-nav-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .dash-nav-left svg { color: var(--black); }

    .dash-nav-left span {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gray-400);
    }

    .dash-logout {
      font-size: 0.8rem;
      color: var(--gray-500);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }

    .dash-logout:hover { color: var(--black); }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .stat-card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      padding: 1.5rem;
    }

    .stat-card .stat-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 0.5rem;
    }

    .stat-card .stat-number {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
    }

    /* Orders table */
    .orders-section {
      padding: 0 2rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .orders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .orders-header h2 {
      font-size: 1rem;
      font-weight: 500;
    }

    .refresh-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      color: var(--gray-500);
      background: none;
      border: 1px solid var(--gray-200);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .refresh-btn:hover {
      border-color: var(--black);
      color: var(--black);
    }

    .orders-table {
      width: 100%;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--gray-100);
    }

    th {
      text-align: left;
      padding: 0.8rem 1rem;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gray-500);
      border-bottom: 1px solid var(--gray-200);
    }

    td {
      padding: 1rem;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--gray-100);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover { background: var(--gray-50); }

    .order-name { font-weight: 400; }

    .order-email {
      color: var(--gray-500);
      font-size: 0.8rem;
    }

    .order-address {
      font-size: 0.8rem;
      color: var(--gray-500);
      max-width: 200px;
    }

    .order-date {
      font-size: 0.8rem;
      color: var(--gray-500);
    }

    /* Status badges */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      border-radius: 50px;
    }

    .badge-pending { background: var(--yellow-bg); color: var(--yellow); }
    .badge-confirmed { background: var(--blue-bg); color: var(--blue); }
    .badge-shipped { background: var(--purple-bg); color: var(--purple); }
    .badge-delivered { background: var(--green-bg); color: var(--green); }
    .badge-cancelled { background: var(--red-bg); color: var(--red); }

    /* Status select */
    .status-select {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--gray-200);
      border-radius: 6px;
      background: var(--white);
      cursor: pointer;
      outline: none;
    }

    .status-select:focus { border-color: var(--black); }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--gray-400);
      font-size: 0.9rem;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--gray-400);
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .orders-table { overflow-x: auto; }
      table { min-width: 700px; }
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login-screen" id="login-screen">
    <h1>longview admin</h1>
    <p>Enter your admin key to continue.</p>
    <div class="login-form">
      <input type="password" id="admin-key" placeholder="Admin key" autofocus>
      <button onclick="login()">Enter</button>
    </div>
    <p class="login-error" id="login-error">Invalid key. Try again.</p>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="dash-nav">
      <div class="dash-nav-left">
        <svg width="100" height="30" viewBox="0 0 160 46">
          <path d="M 58 12 Q 80 4 102 12" fill="none" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>
          <text x="80" y="35" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="currentColor">longview</text>
        </svg>
        <span>Admin</span>
      </div>
    </div>

    <div class="stats" id="stats">
      <div class="stat-card">
        <div class="stat-label">Total Orders</div>
        <div class="stat-number" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-number" id="stat-pending">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Confirmed</div>
        <div class="stat-number" id="stat-confirmed">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Revenue</div>
        <div class="stat-number" id="stat-revenue">—</div>
      </div>
    </div>

    <div class="orders-section">
      <div class="orders-header">
        <h2>Orders</h2>
        <button class="refresh-btn" onclick="loadOrders()">Refresh</button>
      </div>
      <div class="orders-table">
        <div class="loading" id="loading">Loading orders...</div>
        <table style="display:none;" id="orders-table">
          <thead>
            <tr>
              <th>Customer</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Shipping</th>
              <th>Status</th>
              <th>Date</th>
              <th>Update</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none;">No orders yet. They'll show up here.</div>
      </div>
    </div>
  </div>

  <script>
    // No auth for now — load dashboard directly
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadOrders();

    async function loadOrders() {
      const loading = document.getElementById('loading');
      const table = document.getElementById('orders-table');
      const empty = document.getElementById('empty-state');
      const body = document.getElementById('orders-body');

      loading.style.display = 'block';
      table.style.display = 'none';
      empty.style.display = 'none';

      try {
        const res = await fetch('/api/orders', {
          headers: {}
        });

        if (!res.ok) {
          if (res.status === 401) return logout();
          throw new Error('Failed to load');
        }

        const { orders } = await res.json();

        loading.style.display = 'none';

        if (orders.length === 0) {
          empty.style.display = 'block';
          updateStats([]);
          return;
        }

        table.style.display = 'table';
        body.innerHTML = orders.map(order => `
          <tr>
            <td class="order-name">${escapeHtml(order.first_name)} ${escapeHtml(order.last_name)}</td>
            <td class="order-email">${escapeHtml(order.email)}</td>
            <td class="order-email">${escapeHtml(order.phone)}</td>
            <td class="order-address">${escapeHtml(order.address)}, ${escapeHtml(order.city)}, ${escapeHtml(order.state)} ${escapeHtml(order.zip)}</td>
            <td><span class="badge badge-${order.status}">${order.status}</span></td>
            <td class="order-date">${formatDate(order.created_at)}</td>
            <td>
              <select class="status-select" onchange="updateStatus('${order.id}', this.value)">
                <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
            </td>
          </tr>
        `).join('');

        updateStats(orders);

      } catch (err) {
        loading.textContent = 'Failed to load orders.';
      }
    }

    function updateStats(orders) {
      const total = orders.length;
      const pending = orders.filter(o => o.status === 'pending').length;
      const confirmed = orders.filter(o => o.status === 'confirmed').length;
      const active = orders.filter(o => o.status !== 'cancelled').length;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-pending').textContent = pending;
      document.getElementById('stat-confirmed').textContent = confirmed;
      document.getElementById('stat-revenue').textContent = `$${(active * 295).toLocaleString()}`;
    }

    async function updateStatus(id, status) {
      try {
        const res = await fetch('/api/orders', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ id, status }),
        });

        if (res.ok) {
          loadOrders();
        }
      } catch (err) {
        alert('Failed to update status');
      }
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
