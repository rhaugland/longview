<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Longview — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0a;
      --white: #fafafa;
      --gray-50: #f9f9f9;
      --gray-100: #f5f5f5;
      --gray-200: #e5e5e5;
      --gray-400: #a3a3a3;
      --gray-500: #737373;
      --gray-600: #525252;
      --warm: #b8a089;
      --green: #16a34a;
      --green-bg: #f0fdf4;
      --blue: #2563eb;
      --blue-bg: #eff6ff;
      --yellow: #ca8a04;
      --yellow-bg: #fefce8;
      --red: #dc2626;
      --red-bg: #fef2f2;
      --purple: #9333ea;
      --purple-bg: #faf5ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      font-weight: 300;
      background: var(--gray-50);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .dash-nav {
      padding: 1.2rem 2rem;
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dash-nav-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .dash-nav-left svg { color: var(--black); }

    .dash-nav-left span {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gray-400);
    }

    .refresh-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      color: var(--gray-500);
      background: none;
      border: 1px solid var(--gray-200);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .refresh-btn:hover {
      border-color: var(--black);
      color: var(--black);
    }

    /* Kanban columns */
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      align-items: start;
    }

    .column {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      overflow: hidden;
    }

    .column-header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .column-title {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray-500);
    }

    .column-count {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--gray-400);
      background: var(--gray-100);
      padding: 0.15rem 0.5rem;
      border-radius: 50px;
    }

    .column-body {
      padding: 0.75rem;
      min-height: 200px;
    }

    /* Order cards */
    .order-card {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.6rem;
      transition: box-shadow 0.2s;
    }

    .order-card:last-child { margin-bottom: 0; }

    .order-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card-name {
      font-size: 0.88rem;
      font-weight: 400;
      margin-bottom: 0.3rem;
    }

    .card-email {
      font-size: 0.75rem;
      color: var(--gray-500);
      margin-bottom: 0.5rem;
    }

    .card-detail {
      font-size: 0.72rem;
      color: var(--gray-400);
      line-height: 1.5;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--gray-200);
    }

    .card-date {
      font-size: 0.7rem;
      color: var(--gray-400);
    }

    .card-actions {
      display: flex;
      gap: 0.4rem;
    }

    .move-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      font-weight: 500;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-600);
      cursor: pointer;
      transition: all 0.2s;
    }

    .move-btn:hover {
      border-color: var(--black);
      color: var(--black);
    }

    .empty-col {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--gray-400);
      font-size: 0.8rem;
    }

    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--gray-400);
      font-size: 0.85rem;
      grid-column: 1 / -1;
    }

    /* Column accent colors */
    .col-new .column-header { border-bottom-color: var(--yellow); }
    .col-pending .column-header { border-bottom-color: var(--blue); }
    .col-shipped .column-header { border-bottom-color: var(--purple); }
    .col-delivered .column-header { border-bottom-color: var(--green); }

    @media (max-width: 900px) {
      .board { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 580px) {
      .board { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="dash-nav">
    <div class="dash-nav-left">
      <svg width="140" height="28" viewBox="0 0 180 28"><text x="0" y="20" font-family="'DM Sans', sans-serif" font-size="16" font-weight="300" letter-spacing="2.5" fill="currentColor">long</text><text x="70" y="20" font-family="'DM Sans', sans-serif" font-size="16" font-weight="300" letter-spacing="2.5" fill="#b8a089">view</text></svg>
      <span>Admin</span>
    </div>
    <button class="refresh-btn" onclick="loadOrders()">Refresh</button>
  </div>

  <div class="board" id="board">
    <div class="loading" id="loading">Loading orders...</div>
  </div>

  <script>
    const STAGES = [
      { key: 'pending', label: 'New', class: 'col-new', next: 'confirmed' },
      { key: 'confirmed', label: 'Confirmed', class: 'col-pending', next: 'shipped' },
      { key: 'shipped', label: 'Shipped', class: 'col-shipped', next: 'delivered' },
      { key: 'delivered', label: 'Delivered', class: 'col-delivered', next: null },
    ];

    async function loadOrders() {
      const board = document.getElementById('board');
      board.innerHTML = '<div class="loading">Loading orders...</div>';

      try {
        const res = await fetch('/api/orders');
        if (!res.ok) throw new Error('Failed to load');

        const { orders } = await res.json();

        board.innerHTML = STAGES.map(stage => {
          const stageOrders = orders.filter(o => o.status === stage.key);

          const cards = stageOrders.length === 0
            ? '<div class="empty-col">No orders</div>'
            : stageOrders.map(order => `
              <div class="order-card">
                <div class="card-name">${escapeHtml(order.first_name)} ${escapeHtml(order.last_name)}</div>
                <div class="card-email">${escapeHtml(order.email)}</div>
                <div class="card-detail">
                  ${escapeHtml(order.phone)}<br>
                  ${escapeHtml(order.address)}, ${escapeHtml(order.city)}, ${escapeHtml(order.state)} ${escapeHtml(order.zip)}
                </div>
                <div class="card-footer">
                  <span class="card-date">${formatDate(order.created_at)}</span>
                  <div class="card-actions">
                    ${stage.next ? `<button class="move-btn" onclick="updateStatus('${order.id}', '${stage.next}')">${STAGES.find(s => s.key === stage.next).label} &rarr;</button>` : ''}
                    ${stage.key !== 'delivered' ? `<button class="move-btn" onclick="updateStatus('${order.id}', 'cancelled')" style="color:var(--red);border-color:var(--red-bg);">Cancel</button>` : ''}
                  </div>
                </div>
              </div>
            `).join('');

          return `
            <div class="column ${stage.class}">
              <div class="column-header">
                <span class="column-title">${stage.label}</span>
                <span class="column-count">${stageOrders.length}</span>
              </div>
              <div class="column-body">${cards}</div>
            </div>
          `;
        }).join('');

      } catch (err) {
        board.innerHTML = '<div class="loading">Failed to load orders.</div>';
      }
    }

    async function updateStatus(id, status) {
      try {
        const res = await fetch('/api/orders', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status }),
        });
        if (res.ok) loadOrders();
      } catch (err) {
        alert('Failed to update status');
      }
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    loadOrders();
  </script>
</body>
</html>
