<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Longview — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0a;
      --white: #fafafa;
      --gray-50: #f9f9f9;
      --gray-100: #f5f5f5;
      --gray-200: #e5e5e5;
      --gray-400: #a3a3a3;
      --gray-500: #737373;
      --gray-600: #525252;
      --warm: #b8a089;
      --warm-bg: #faf6f1;
      --green: #16a34a;
      --green-light: #bbf7d0;
      --blue: #2563eb;
      --blue-light: #bfdbfe;
      --yellow: #ca8a04;
      --yellow-light: #fef08a;
      --purple: #9333ea;
      --purple-light: #e9d5ff;
      --red: #dc2626;
      --red-bg: #fef2f2;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      font-weight: 300;
      background: var(--warm-bg);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Nav */
    .dash-nav {
      padding: 1.2rem 2.5rem;
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dash-nav-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .dash-nav-left span {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gray-400);
    }

    .refresh-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      color: var(--gray-500);
      background: none;
      border: 1px solid var(--gray-200);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .refresh-btn:hover {
      border-color: var(--black);
      color: var(--black);
    }

    /* Content */
    .content {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2rem 2.5rem;
    }

    /* Filter tabs */
    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-tab {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      padding: 0.45rem 1rem;
      border-radius: 50px;
      border: 1px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-600);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-tab:hover {
      border-color: var(--gray-500);
    }

    .filter-tab.active {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }

    .filter-count {
      font-size: 0.7rem;
      margin-left: 0.2rem;
      opacity: 0.6;
    }

    /* Status groups */
    .status-group {
      margin-bottom: 2.5rem;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }

    .group-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-pending { background: var(--yellow); }
    .dot-confirmed { background: var(--blue); }
    .dot-shipped { background: var(--purple); }
    .dot-delivered { background: var(--green); }

    .group-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--black);
    }

    .group-count {
      font-size: 0.82rem;
      color: var(--gray-400);
      font-weight: 300;
    }

    /* Table */
    .orders-table {
      width: 100%;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead { background: var(--gray-100); }

    th {
      text-align: left;
      padding: 0.7rem 1rem;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gray-500);
      border-bottom: 1px solid var(--gray-200);
    }

    td {
      padding: 0.9rem 1rem;
      font-size: 0.84rem;
      border-bottom: 1px solid var(--gray-100);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover { background: var(--gray-50); }

    .td-name { font-weight: 400; }

    .td-sub {
      font-size: 0.75rem;
      color: var(--gray-500);
      margin-top: 0.15rem;
    }

    .td-muted {
      color: var(--gray-500);
      font-size: 0.8rem;
    }

    .td-price {
      font-weight: 500;
    }

    /* Status select */
    .status-select {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      border: 1px solid;
      cursor: pointer;
      outline: none;
      -webkit-appearance: none;
      background: none;
    }

    .sel-pending { border-color: var(--yellow-light); color: var(--yellow); background: #fefce8; }
    .sel-confirmed { border-color: var(--blue-light); color: var(--blue); background: #eff6ff; }
    .sel-shipped { border-color: var(--purple-light); color: var(--purple); background: #faf5ff; }
    .sel-delivered { border-color: var(--green-light); color: var(--green); background: #f0fdf4; }

    /* Nav right */
    .dash-nav-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .team-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      color: var(--gray-500);
      background: none;
      border: 1px solid var(--gray-200);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .team-btn:hover {
      border-color: var(--black);
      color: var(--black);
    }

    /* Team panel */
    .team-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      height: 100vh;
      background: var(--white);
      border-left: 1px solid var(--gray-200);
      z-index: 100;
      box-shadow: -4px 0 20px rgba(0,0,0,0.05);
    }

    .team-panel-header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-panel-title {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .team-close {
      background: none;
      border: none;
      font-size: 1.3rem;
      color: var(--gray-400);
      cursor: pointer;
      line-height: 1;
    }

    .team-close:hover { color: var(--black); }

    .team-member {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid var(--gray-100);
    }

    .member-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--warm);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .member-name {
      font-size: 0.85rem;
      font-weight: 400;
    }

    .member-role {
      font-size: 0.72rem;
      color: var(--gray-400);
    }

    /* Team add form */
    .team-add {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .team-input {
      width: 100%;
      padding: 0.55rem 0.75rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      border: 1px solid var(--gray-200);
      border-radius: 6px;
      outline: none;
      background: var(--white);
    }

    .team-input:focus { border-color: var(--black); }

    .team-select {
      -webkit-appearance: none;
      cursor: pointer;
      color: var(--gray-600);
    }

    .add-member-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      padding: 0.55rem;
      border-radius: 6px;
      border: none;
      background: var(--black);
      color: var(--white);
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-member-btn:hover { background: #262626; }

    .member-remove {
      background: none;
      border: none;
      color: var(--gray-400);
      font-size: 1rem;
      cursor: pointer;
      line-height: 1;
      margin-left: auto;
      padding: 0 0.25rem;
    }

    .member-remove:hover { color: var(--red); }

    .member-info { flex: 1; }

    /* Owner in table */
    .owner-cell {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .owner-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    .owner-name {
      font-size: 0.8rem;
      font-weight: 400;
    }

    .claim-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      border: 1px solid var(--warm);
      background: var(--warm-bg);
      color: var(--warm);
      cursor: pointer;
      transition: all 0.2s;
      -webkit-appearance: none;
      outline: none;
    }

    .claim-btn:hover, .claim-btn:focus {
      border-color: var(--warm);
    }

    .unclaim-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      color: var(--gray-400);
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 0.15rem;
      display: block;
    }

    .unclaim-btn:hover { color: var(--red); }

    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--gray-400);
      font-size: 0.85rem;
    }

    .empty-all {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--gray-400);
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .content { padding: 1.5rem 1rem; }
      .dash-nav { padding: 1rem 1rem; }
      .orders-table { overflow-x: auto; }
      table { min-width: 700px; }
    }
  </style>
</head>
<body>

  <div class="dash-nav">
    <div class="dash-nav-left">
      <svg width="140" height="28" viewBox="0 0 180 28"><text x="0" y="20" font-family="'DM Sans', sans-serif" font-size="16" font-weight="300" letter-spacing="2.5" fill="currentColor">long</text><text x="70" y="20" font-family="'DM Sans', sans-serif" font-size="16" font-weight="300" letter-spacing="2.5" fill="#b8a089">view</text></svg>
      <span>Admin</span>
    </div>
    <div class="dash-nav-right">
      <button class="team-btn" onclick="toggleTeamPanel()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <circle cx="8" cy="5" r="3"/>
          <path d="M 2 14 C 2 11 5 9 8 9 C 11 9 14 11 14 14"/>
        </svg>
        Team
      </button>
      <button class="refresh-btn" onclick="loadOrders()">Refresh</button>
    </div>
  </div>

  <!-- Team panel -->
  <div class="team-panel" id="team-panel" style="display:none;">
    <div class="team-panel-header">
      <span class="team-panel-title">Team</span>
      <button class="team-close" onclick="toggleTeamPanel()">&times;</button>
    </div>
    <div id="team-list"></div>
    <div class="team-add">
      <input type="text" id="new-member-name" placeholder="Name" class="team-input">
      <select id="new-member-role" class="team-input team-select">
        <option value="Worker">Worker</option>
        <option value="Admin">Admin</option>
      </select>
      <button class="add-member-btn" onclick="addMember()">Add</button>
    </div>
  </div>

  <div class="content" id="content">
    <div class="loading">Loading orders...</div>
  </div>

  <script>
    const STAGES = [
      { key: 'pending', label: 'New', dot: 'dot-pending', sel: 'sel-pending' },
      { key: 'confirmed', label: 'Processing', dot: 'dot-confirmed', sel: 'sel-confirmed' },
      { key: 'shipped', label: 'Shipped', dot: 'dot-shipped', sel: 'sel-shipped' },
      { key: 'delivered', label: 'Delivered', dot: 'dot-delivered', sel: 'sel-delivered' },
    ];

    let allOrders = [];
    let activeFilter = 'all';

    function renderFilters() {
      const total = allOrders.length;
      const counts = {};
      STAGES.forEach(s => counts[s.key] = allOrders.filter(o => o.status === s.key).length);

      return `
        <div class="filters">
          <button class="filter-tab ${activeFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All<span class="filter-count">${total}</span></button>
          ${STAGES.map(s => `
            <button class="filter-tab ${activeFilter === s.key ? 'active' : ''}" onclick="setFilter('${s.key}')">${s.label}<span class="filter-count">${counts[s.key]}</span></button>
          `).join('')}
        </div>
      `;
    }

    function renderGroup(stage, orders) {
      if (orders.length === 0) return '';

      const showOwner = stage.key === 'pending';

      const rows = orders.map(order => {
        const ownerCell = showOwner
          ? order.owner
            ? `<td><div class="owner-cell"><span class="owner-dot"></span><span class="owner-name">${esc(order.owner)}</span></div><button class="unclaim-btn" onclick="claimOrder('${order.id}', null)">unclaim</button></td>`
            : `<td><select class="claim-btn" onchange="if(this.value) claimOrder('${order.id}', this.value)"><option value="">Claim...</option>${teamMembers.map(m => '<option value="' + esc(m.name) + '">' + esc(m.name) + '</option>').join('')}</select></td>`
          : '';

        return `
          <tr>
            <td>
              <div class="td-name">${esc(order.first_name)} ${esc(order.last_name)}</div>
              <div class="td-sub">${esc(order.email)}</div>
            </td>
            <td class="td-muted">${esc(order.phone)}</td>
            <td class="td-muted">${esc(order.address)}, ${esc(order.city)}, ${esc(order.state)} ${esc(order.zip)}</td>
            ${ownerCell}
            <td class="td-price">$295</td>
            <td>
              <select class="status-select ${stage.sel}" onchange="updateStatus('${order.id}', this.value)">
                ${STAGES.map(s => `<option value="${s.key}" ${order.status === s.key ? 'selected' : ''}>${s.label}</option>`).join('')}
                <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
            </td>
            <td class="td-muted">${formatDate(order.created_at)}</td>
          </tr>
        `;
      }).join('');

      return `
        <div class="status-group">
          <div class="group-header">
            <span class="group-dot ${stage.dot}"></span>
            <span class="group-title">${stage.label}</span>
            <span class="group-count">${orders.length} order${orders.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="orders-table">
            <table>
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Phone</th>
                  <th>Shipping</th>
                  ${showOwner ? '<th>Owner</th>' : ''}
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function render() {
      const content = document.getElementById('content');

      if (allOrders.length === 0) {
        content.innerHTML = renderFilters() + '<div class="empty-all">No orders yet. They\'ll show up here.</div>';
        return;
      }

      const visibleStages = activeFilter === 'all' ? STAGES : STAGES.filter(s => s.key === activeFilter);

      let groups = visibleStages.map(stage => {
        const stageOrders = allOrders.filter(o => o.status === stage.key);
        return renderGroup(stage, stageOrders);
      }).join('');

      if (!groups.trim()) {
        groups = '<div class="empty-all">No orders in this status.</div>';
      }

      content.innerHTML = renderFilters() + groups;
    }

    function setFilter(key) {
      activeFilter = key;
      render();
    }

    async function loadOrders() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">Loading orders...</div>';

      try {
        const res = await fetch('/api/orders');
        if (!res.ok) throw new Error('Failed to load');

        const data = await res.json();
        allOrders = data.orders;
        render();
      } catch (err) {
        content.innerHTML = '<div class="loading">Failed to load orders.</div>';
      }
    }

    let teamMembers = [];

    function toggleTeamPanel() {
      const panel = document.getElementById('team-panel');
      const showing = panel.style.display === 'none';
      panel.style.display = showing ? 'block' : 'none';
      if (showing) loadTeam();
    }

    async function loadTeam() {
      try {
        const res = await fetch('/api/team');
        if (!res.ok) throw new Error('Failed to load');
        const data = await res.json();
        teamMembers = data.members;
        renderTeamList();
        render(); // re-render orders so claim dropdowns update
      } catch (err) {
        document.getElementById('team-list').innerHTML = '<div style="padding:1rem 1.5rem;color:var(--gray-400);font-size:0.82rem;">Failed to load team.</div>';
      }
    }

    function renderTeamList() {
      const list = document.getElementById('team-list');
      if (teamMembers.length === 0) {
        list.innerHTML = '<div style="padding:1rem 1.5rem;color:var(--gray-400);font-size:0.82rem;">No team members yet.</div>';
        return;
      }
      list.innerHTML = teamMembers.map(m => {
        const initials = m.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        return `
          <div class="team-member">
            <div class="member-avatar">${esc(initials)}</div>
            <div class="member-info">
              <div class="member-name">${esc(m.name)}</div>
              <div class="member-role">${esc(m.role)}</div>
            </div>
            <button class="member-remove" onclick="removeMember('${m.id}')" title="Remove">&times;</button>
          </div>
        `;
      }).join('');
    }

    async function addMember() {
      const nameInput = document.getElementById('new-member-name');
      const roleSelect = document.getElementById('new-member-role');
      const name = nameInput.value.trim();
      if (!name) return;

      try {
        const res = await fetch('/api/team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, role: roleSelect.value }),
        });
        if (res.ok) {
          nameInput.value = '';
          loadTeam();
        }
      } catch (err) {
        alert('Failed to add member');
      }
    }

    async function removeMember(id) {
      try {
        const res = await fetch('/api/team', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id }),
        });
        if (res.ok) loadTeam();
      } catch (err) {
        alert('Failed to remove member');
      }
    }

    async function claimOrder(id, owner) {
      try {
        // When claiming, auto-move to confirmed; when unclaiming, move back to pending
        const body = owner
          ? { id, owner, status: 'confirmed' }
          : { id, owner, status: 'pending' };
        const res = await fetch('/api/orders', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (res.ok) loadOrders();
      } catch (err) {
        alert('Failed to update owner');
      }
    }

    async function updateStatus(id, status) {
      const order = allOrders.find(o => o.id === id);
      if (order && order.status === 'pending' && !order.owner && status !== 'pending') {
        alert('Someone must claim this order before it can be moved.');
        render();
        return;
      }
      try {
        const res = await fetch('/api/orders', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status }),
        });
        if (res.ok) loadOrders();
      } catch (err) {
        alert('Failed to update status');
      }
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // Load team first so claim dropdowns are populated, then orders
    fetch('/api/team').then(r => r.json()).then(data => {
      teamMembers = data.members || [];
    }).catch(() => {}).finally(() => loadOrders());
  </script>
</body>
</html>
